name: Daily NAVER news collection

on:
  schedule:
    # 19:13 UTC = 04:13 KST. GitHub 예약 실행이 몇 시간씩 밀리는 경우가 많아
    # 일찍 걸어둔다. Claude 쪽 요약 작업은 13:17 KST에 실행된다.
    - cron: "13 19 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        env:
          NCP_APIHUB_CLIENT_ID: ${{ secrets.NCP_APIHUB_CLIENT_ID }}
          NCP_APIHUB_CLIENT_SECRET: ${{ secrets.NCP_APIHUB_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/collect_naver.py
