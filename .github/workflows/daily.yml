name: Daily NAVER news collection

on:
  schedule:
    # 20:30 UTC = 05:30 KST (Claude 쪽 보강 작업이 06:00 KST에 돌 때
    # 이미 원시 데이터가 Notion에 들어가 있도록 30분 먼저 실행)
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DEBUG - inspect NOTION_DATABASE_ID shape (no plaintext)
        env:
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 - <<'PYEOF'
          import os
          v = os.environ.get("NOTION_DATABASE_ID", "")
          print("len:", len(v))
          print("repr of first 4 / last 4 chars:", repr(v[:4]), repr(v[-4:]))
          print("has whitespace:", v != v.strip())
          print("dash count:", v.count("-"))
          print("all hex after dash-strip:", v.replace("-", "").isalnum())
          PYEOF
      - name: Run collector
        env:
          NCP_APIHUB_CLIENT_ID: ${{ secrets.NCP_APIHUB_CLIENT_ID }}
          NCP_APIHUB_CLIENT_SECRET: ${{ secrets.NCP_APIHUB_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/collect_naver.py
