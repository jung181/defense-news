name: Daily NAVER news collection

on:
  schedule:
    # 20:30 UTC = 05:30 KST (Claude 쪽 보강 작업이 06:00 KST에 돌 때
    # 이미 원시 데이터가 Notion에 들어가 있도록 30분 먼저 실행)
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DEBUG - test other NAVER API HUB endpoints with same key
        env:
          NCP_APIHUB_CLIENT_ID: ${{ secrets.NCP_APIHUB_CLIENT_ID }}
          NCP_APIHUB_CLIENT_SECRET: ${{ secrets.NCP_APIHUB_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import http.client, os, ssl, urllib.parse
          cid = os.environ["NCP_APIHUB_CLIENT_ID"]
          secret = os.environ["NCP_APIHUB_CLIENT_SECRET"]
          headers = {"X-NCP-APIGW-API-KEY-ID": cid, "X-NCP-APIGW-API-KEY": secret}
          for path, label in [
              ("/search/v1/news?query=test&display=1", "뉴스(news)"),
              ("/search/v1/blog?query=test&display=1", "블로그(blog)"),
              ("/search/v1/webkr?query=test&display=1", "웹문서(webkr)"),
          ]:
              conn = http.client.HTTPSConnection("naverapihub.apigw.ntruss.com", timeout=20, context=ssl.create_default_context())
              conn.request("GET", path, headers=headers)
              resp = conn.getresponse()
              body = resp.read().decode("utf-8", errors="replace")[:200]
              print(f"[{label}] status={resp.status} body={body}")
              conn.close()
          PYEOF
      - name: Run collector
        env:
          NCP_APIHUB_CLIENT_ID: ${{ secrets.NCP_APIHUB_CLIENT_ID }}
          NCP_APIHUB_CLIENT_SECRET: ${{ secrets.NCP_APIHUB_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/collect_naver.py
